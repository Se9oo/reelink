name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [backend, frontend]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install -g pnpm@11.7.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

      # PageProps 같은 라우트 타입은 .next/types에 생성돼야 tsc가 통과한다
      - if: matrix.app == 'frontend'
        run: pnpm exec next typegen

      - run: pnpm exec tsc --noEmit
      - run: pnpm test

  deploy:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: postgres
          push: true
          tags: |
            ghcr.io/se9oo/reelink-postgres:latest
            ghcr.io/se9oo/reelink-postgres:${{ github.sha }}
          cache-from: type=gha,scope=postgres
          cache-to: type=gha,mode=max,scope=postgres

      - uses: docker/build-push-action@v6
        with:
          context: apps/backend
          push: true
          tags: |
            ghcr.io/se9oo/reelink-backend:latest
            ghcr.io/se9oo/reelink-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      # NEXT_PUBLIC_* 값은 빌드할 때 JS에 박힌다
      - uses: docker/build-push-action@v6
        with:
          context: apps/frontend
          push: true
          tags: |
            ghcr.io/se9oo/reelink-frontend:latest
            ghcr.io/se9oo/reelink-frontend:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.PUBLIC_URL }}/api
            NEXT_PUBLIC_SITE_URL=${{ vars.PUBLIC_URL }}
            NEXT_PUBLIC_KAKAO_CHANNEL_CHAT_URL=${{ vars.KAKAO_CHANNEL_CHAT_URL }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: 서버에 배포
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts
          TARGET="$SSH_USER@$SSH_HOST"

          ssh "$TARGET" "mkdir -p ~/reelink/nginx"
          scp docker-compose.yml "$TARGET:~/reelink/"
          scp nginx/nginx.conf "$TARGET:~/reelink/nginx/"

          echo "$GHCR_TOKEN" | ssh "$TARGET" "docker login ghcr.io -u $GHCR_USER --password-stdin"
          ssh "$TARGET" "
            set -e
            cd ~/reelink
            docker compose pull postgres backend frontend
            docker compose run --rm backend node dist/db/migrate.js
            docker compose up -d
            # nginx는 upstream IP를 시작할 때 한 번만 조회하므로, 새로 뜬 backend·frontend IP와 바뀐 nginx.conf를 반영한다
            docker compose exec -T nginx nginx -s reload
            docker image prune -f
          "
