events {}

http {
  # Cloudflare 프록시를 거친 요청만 CF-Connecting-IP를 진짜 사용자 IP로 믿는다(게스트 생성 제한이 사용자 IP별로 걸리게)
  # 대역 출처: https://www.cloudflare.com/ips/ — 바뀌면 여기와 Lightsail 방화벽을 같이 갱신
  set_real_ip_from 173.245.48.0/20;
  set_real_ip_from 103.21.244.0/22;
  set_real_ip_from 103.22.200.0/22;
  set_real_ip_from 103.31.4.0/22;
  set_real_ip_from 141.101.64.0/18;
  set_real_ip_from 108.162.192.0/18;
  set_real_ip_from 190.93.240.0/20;
  set_real_ip_from 188.114.96.0/20;
  set_real_ip_from 197.234.240.0/22;
  set_real_ip_from 198.41.128.0/17;
  set_real_ip_from 162.158.0.0/15;
  set_real_ip_from 104.16.0.0/13;
  set_real_ip_from 104.24.0.0/14;
  set_real_ip_from 172.64.0.0/13;
  set_real_ip_from 131.0.72.0/22;
  set_real_ip_from 2400:cb00::/32;
  set_real_ip_from 2606:4700::/32;
  set_real_ip_from 2803:f800::/32;
  set_real_ip_from 2405:b500::/32;
  set_real_ip_from 2405:8100::/32;
  set_real_ip_from 2a06:98c0::/29;
  set_real_ip_from 2c0f:f248::/32;
  real_ip_header CF-Connecting-IP;

  # 게스트 생성 남용 방지: IP당 분당 10회(모바일 통신사 NAT로 여러 사용자가 IP를 공유하는 걸 감안해 burst 20)
  limit_req_zone $binary_remote_addr zone=guest:1m rate=10r/m;

  upstream frontend {
    server frontend:3000;
  }

  upstream backend {
    server backend:3000;
  }

  server {
    listen 80;
    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl;
    http2 on;
    # Cloudflare Origin CA 인증서. Cloudflare 프록시(Full strict)만 믿는 인증서라 프록시를 끄면 브라우저 경고가 뜬다
    ssl_certificate /etc/ssl/reelink/origin.pem;
    ssl_certificate_key /etc/ssl/reelink/origin.key;

    location = /api/auth/guest {
      limit_req zone=guest burst=20 nodelay;
      limit_req_status 429;
      proxy_pass http://backend/auth/guest;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # /api로 오는 요청은 backend로
    location /api/ {
      proxy_pass http://backend/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 나머지는 다 frontend로
    location / {
      proxy_pass http://frontend/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}