events {}

http {
  # 게스트 생성 남용 방지: IP당 분당 10회(모바일 통신사 NAT로 여러 사용자가 IP를 공유하는 걸 감안해 burst 20)
  limit_req_zone $binary_remote_addr zone=guest:1m rate=10r/m;

  upstream frontend {
    server frontend:3000;
  }

  upstream backend {
    server backend:3000;
  }

  server {
    listen 80;
    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl;
    http2 on;
    # certbot --cert-name reelink로 발급해서 도메인과 상관없이 경로가 고정된다
    ssl_certificate /etc/letsencrypt/live/reelink/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/reelink/privkey.pem;

    location = /api/auth/guest {
      limit_req zone=guest burst=20 nodelay;
      limit_req_status 429;
      proxy_pass http://backend/auth/guest;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # /api로 오는 요청은 backend로
    location /api/ {
      proxy_pass http://backend/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 나머지는 다 frontend로
    location / {
      proxy_pass http://frontend/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}