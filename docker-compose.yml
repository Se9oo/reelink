services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - reelink-network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - reelink-network

  backend:
    image: ghcr.io/se9oo/reelink-backend:${IMAGE_TAG:-latest}
    build:
      context: ./apps/backend
    restart: unless-stopped
    env_file:
      - ./apps/backend/.env
    depends_on:
      - postgres
      - redis
    networks:
      - reelink-network

  frontend:
    image: ghcr.io/se9oo/reelink-frontend:${IMAGE_TAG:-latest}
    build:
      context: ./apps/frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - reelink-network

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/ssl/reelink:/etc/ssl/reelink:ro
    depends_on:
      - frontend
      - backend
    networks:
      - reelink-network

volumes:
  postgres_data:

networks:
  reelink-network:
    driver: bridge
