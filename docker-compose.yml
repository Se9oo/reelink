services:
  postgres:
    image: ghcr.io/se9oo/reelink-postgres:${IMAGE_TAG:-latest}
    build:
      context: ./postgres
    restart: unless-stopped
    # WAL을 5분마다 R2로 올린다(손실 상한 5분). 전체 백업·정리는 서버 crontab이 매일 돌린다
    command: >
      postgres
      -c archive_mode=on
      -c archive_command='wal-g wal-push %p'
      -c archive_timeout=300
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    env_file:
      - ./postgres-backup.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - reelink-network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - reelink-network

  backend:
    image: ghcr.io/se9oo/reelink-backend:${IMAGE_TAG:-latest}
    build:
      context: ./apps/backend
    restart: unless-stopped
    env_file:
      - ./apps/backend/.env
    depends_on:
      - postgres
      - redis
    networks:
      - reelink-network

  frontend:
    image: ghcr.io/se9oo/reelink-frontend:${IMAGE_TAG:-latest}
    build:
      context: ./apps/frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - reelink-network

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/ssl/reelink:/etc/ssl/reelink:ro
    depends_on:
      - frontend
      - backend
    networks:
      - reelink-network

volumes:
  postgres_data:

networks:
  reelink-network:
    driver: bridge
